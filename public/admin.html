<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — College Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="index.html">
      <span class="college-logo"><img src="img/dpu-logo.png" alt="DPGU School of Technology and Research"></span>
      <span class="dot"></span>College Club Hub
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="clubs.html">Clubs</a>
      <a href="calendar.html">Calendar</a>
      <button id="theme-toggle" title="Toggle theme" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </div>
</header>

<main>
  <div class="section-title">
    <h2>Event submissions — review queue</h2>
  </div>

  <div class="admin-bar">
    <input type="password" id="admin-key" placeholder="Admin key" style="min-width: 220px;">
    <input type="text" id="sheet-url" placeholder="Google Sheet CSV URL (optional if set in .env)" style="min-width: 320px; flex: 1;">
    <button class="btn" id="sync-btn">Sync from Google Sheet</button>
    <button class="btn btn-secondary" id="save-key-btn">Save key</button>
  </div>
  <p class="meta" id="status-line"></p>

  <div id="pending-list"></div>
</main>

<footer>
  <div>Admin tools — not linked from the public site.</div>
  <div class="credit">Designed &amp; built by <strong>Aayush Dhole</strong> &middot; &copy; 2026 &middot; All rights reserved</div>
</footer>

<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
